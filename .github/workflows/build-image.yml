# 构建镜像并推送到 JD 仓库。两种触发：
#   1. 推 v* tag：git tag v0.3 && git push origin v0.3 —— 正式发版
#   2. Actions 页面 "Run workflow" 选 main —— 同 tag 后攒了提交，想出个带距离号
#      的路过镜像（如 v0.2-3-gXXXX），无需新 tag
#
# 日常 push main 不自动构建（镜像仓库只留发布镜像，不堆 WIP）。
#
# 复用 deploy/build-image.sh（宿主机 Go 原生编译 + Node 构建 →
# 只用 containerlize/standalone/Dockerfile 打运行时镜像）。GitHub Actions 的 amd64 runner
# 与目标架构一致（GOOS=linux 原生即可），唯一进容器的步骤是 microdnf install。
#
# 所需 GitHub Secrets（Settings → Secrets and variables → Actions）：
#   JD_REGISTRY_USERNAME   hub-pub.jdcloud.com 镜像推送账号
#   JD_REGISTRY_PASSWORD   对应密码/token
# 凭据只存 GitHub Secrets（加密封存），不进代码、不进镜像、不进日志。
#
# 镜像 tag 形如 v0.4.0-ga0c5ac1-202610160730：版本 tag + 短 SHA + 时间戳。
# 构建由推 tag 触发，一个 tag 只触发一次，无需距离号；短 SHA 把镜像与 commit 锁死。
# tag 命名约定 x.y.z 三段。部署：
on:
  push:
    tags: ['v*']          # 推 v* tag 自动触发（正式发版）
  workflow_dispatch:      # Actions 页面 "Run workflow" 手动触发（同 tag 多次构建）

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04   # 固定版本：ubuntu-latest 2026-10-19 起切 Ubuntu 26，避免环境突变
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7   # v7 跑 Node 24，消除 Node 20 弃用警告
        with:
          fetch-depth: 0   # 完整历史+tag：build-image.sh 用 git describe 生成版本号

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # pnpm install 会触发 prepare → simple-git-hooks，CI 里无意义且可能失败。
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: frontend

      - name: Backend tests (gate)
        run: go test ./...
        working-directory: backend

      # 凭据来自 GitHub Secrets，stdin 传入（不进进程参数、不进日志）。
      - name: Login to JD registry
        env:
          JD_REGISTRY_USERNAME: ${{ secrets.JD_REGISTRY_USERNAME }}
          JD_REGISTRY_PASSWORD: ${{ secrets.JD_REGISTRY_PASSWORD }}
        run: |
          echo "$JD_REGISTRY_PASSWORD" | docker login hub-pub.jdcloud.com \
            -u "$JD_REGISTRY_USERNAME" --password-stdin

      - name: Build and push image
        env:
          REGISTRY: hub-pub.jdcloud.com/iaas-jf
        run: ./deploy/build-image.sh --push
