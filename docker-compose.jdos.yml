# 本地/测试：用 JDOS 制品或本仓库构建的镜像起 isobuilder。
#
# 入口被覆盖成二进制直启：JDOS 镜像原生的 start_container.sh 会 while true
# 重试 mirrors.jdfin.local（jdos 平台内网域名），本地解析不到就永远起不来；
# 它另外还要 sshd/crond/公钥注入，那些本地都没有意义。覆盖入口比改脚本更干净。
#
# 数据库只有一个来源：挂载进来的 config.yaml，由 -c 指定。改完重启即生效。
#
# 用法：
#   cp config.local.yaml.example config.local.yaml && chmod 600 config.local.yaml
#   docker compose -f docker-compose.jdos.yml up -d
#   docker compose -f docker-compose.jdos.yml logs -f
#   docker compose -f docker-compose.jdos.yml down
#
# 换镜像（默认用本仓库构建的，见 deploy/build-image.sh）：
#   IMAGE=hub.is.jd.com/technical-service/isobuilder:<tag> \
#     docker compose -f docker-compose.jdos.yml up -d
services:
  isobuilder:
    # 默认用本仓库当前代码构建的镜像（deploy/build-image.sh），而不是 JDOS 上那个旧 tag——
    # 旧制品不含 MySQL 方言，连 mysql:// 会回退到 PostgreSQL 解析并失败。
    image: ${IMAGE:-isobuilder:0.0.0-local-202610181734}
    container_name: isobuilder-jdos
    restart: unless-stopped
    # 本地镜像的 ENTRYPOINT 已是二进制本身；显式声明便于与 JDOS 制品共用同一份 compose。
    entrypoint: ["/opt/isobuilder/isobuilder"]
    command: ["-c", "/home/export/App/cfg/config.yaml"]
    ports:
      - "${PORT:-8080}:8080"
    environment:
      ISOBUILDER_ADDR: ":8080"
      ISOBUILDER_DATA_DIR: /opt/isobuilder/data
      ISOBUILDER_WEB_DIR: /opt/isobuilder/web
      ISOBUILDER_BUILTIN_DIR: /opt/isobuilder/kickstarts
      TZ: Asia/Shanghai
    volumes:
      # 全部数据库配置在这里（database_url 等），见 config.local.yaml.example
      - ./config.local.yaml:/home/export/App/cfg/config.yaml:ro
      # 数据目录（ISO/构建产物/上传），宿主机持久化
      - isobuilder-data:/opt/isobuilder/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # ISO 构建（xorriso）是 CPU + 顺序 I/O 密集，按机器实际情况调整
    cpus: "4"
    mem_limit: 4g

volumes:
  isobuilder-data:
