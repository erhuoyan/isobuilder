name: isobuilder

# 通用单容器部署（从源码构建）。全部运行时配置来自挂载的 config.yaml，
# 由 -c 指定；只有数据库凭据可以用环境变量注入。
#
#   cp config.local.yaml.example config.local.yaml   # 按需修改
#   docker compose up -d
#
# 对象存储既可以在 config.yaml 里写（首次种子值），也可以在 Web「系统配置」
# 页维护——后者的值存在数据库里，优先级更高。
services:
  isobuilder:
    build:
      context: .
      dockerfile: Dockerfile
    image: isobuilder:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    command: ["-c", "/etc/isobuilder/config.yaml"]
    environment:
      # 只有数据库凭据走环境变量，便于把密码从配置文件里剥离。
      # config.yaml 里若写了 database_url，以配置文件为准。
      ISOBUILDER_DB_URL: ${ISOBUILDER_DB_URL:-}
    volumes:
      - isobuilder-data:/opt/isobuilder/data
      # 全部运行时设置（addr / data_dir / max_concurrent_builds / storage …）
      - ./config.local.yaml:/etc/isobuilder/config.yaml:ro

volumes:
  isobuilder-data:
