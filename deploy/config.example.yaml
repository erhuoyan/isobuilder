# isobuilder 配置文件示例（用 -c 指定）
#
#   isobuilder -c /path/to/config.yaml
#
# JDOS：放到 /home/export/App/cfg/config.yaml，bin/start.sh 检测到即自动加 -c。
# K8s ：Secret 挂载 + Deployment args: [-c, /etc/isobuilder/config.yaml]。
# 本地：docker compose -f docker-compose.jdos.yml（已挂载该路径）。
#
# 优先级：本文件 > 环境变量 > 内置默认值。只写需要改的键即可，
# 未出现的键继续沿用环境变量或默认值。所有键都是扁平的顶层键。
#
# 注意：值里若含 # 或 : 空格，请用引号包起来。

# ── 服务 ──────────────────────────────────────────────────────────────
# 监听地址；只写 :端口 即可监听所有网卡。
addr: ":8080"

# API 鉴权令牌；留空 = 不鉴权。设置后请求需 Authorization: Bearer <token>。
# auth_token: ""

# ── 目录 ──────────────────────────────────────────────────────────────
# 数据根目录。isos/ uploads/ work/ builds/ kickstarts/ artifacts/ 与
# isobuilder.db 全部由它自动派生，不单独配置——把它们拆到不同文件系统会
# 破坏产物移动（跨设备退化为复制，需要双倍空间）。
data_dir: /opt/isobuilder/data

# 启动/停止脚本的日志目录（Go 程序本身写 stderr，由脚本重定向）。
log_dir: /export/log/isobuilder

# 内置资源目录（镜像内，一般不用改）
# builtin_dir: /opt/isobuilder/kickstarts
# web_dir: /opt/isobuilder/web

# ── 数据库 ────────────────────────────────────────────────────────────
# 留空 = 容器内 SQLite（<data_dir>/isobuilder.db）。
# URL 形式：
#   database_url: 'postgres://user:pass@host:5432/isobuilder?sslmode=prefer'
# key=value 形式（密码含 @ 等特殊字符时无需转义，推荐）：
database_url: 'host=204.1.2.3 port=5432 user=isobuilder password=secret dbname=isobuilder sslmode=prefer'

# ── 构建限制 ──────────────────────────────────────────────────────────
# 单次上传上限（字节），默认 40 GiB。
# max_upload_bytes: 42949672960
# 并发构建数；每个约占用 2×基础 ISO 的工作空间。
# max_concurrent_builds: 1
# 构建超时（分钟），默认 180。
# build_timeout_minutes: 180
# 保留构建工作目录（排障用，占空间）。
# keep_work_dir: false
# 保留产物本地副本（已上传对象存储时）。
# keep_local_artifact: false

# ── 对象存储（初始默认值）─────────────────────────────────────────────
# 注意：对象存储的最终配置存在数据库 settings 表里（Web「系统配置」页维护），
# 数据库里的值优先。这里只是首次启动的种子值，通常无需填写。
# storage:
#   endpoint: https://oss.example.com
#   region: us-east-1
#   bucket: auto-iso
#   prefix: auto-iso
#   access_key: ""
#   secret_key: ""
#   public_base: ""
#   presign_ttl_seconds: 86400
#   path_style: true
#   insecure_tls: false
