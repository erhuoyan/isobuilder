# 复制为 secret.yaml 并填入真实值后应用：
#   kubectl -n isobuilder apply -f secret.yaml
# 不要把填好的 secret.yaml 提交到 git。
apiVersion: v1
kind: Secret
metadata:
  name: isobuilder-db
  namespace: isobuilder
type: Opaque
stringData:
  # config.yaml 挂载到 /etc/isobuilder/config.yaml，由 Deployment 的 -c 指定。
  # 只放一个键 database_url（URL 或 key=value 两种写法均可）：
  #   database_url: postgres://user:pass@host:5432/isobuilder?sslmode=prefer
  #   database_url: host=<host> port=5432 user=<user> password=<pass> dbname=isobuilder sslmode=prefer
  config.yaml: |
    database_url: host=REPLACE_ME port=5432 user=REPLACE_ME password=REPLACE_ME dbname=isobuilder sslmode=prefer

  # 可选：设置后接口需要 Authorization: Bearer <token>；留空表示不鉴权。
  auth_token: ""
