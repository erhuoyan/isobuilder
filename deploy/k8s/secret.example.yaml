# 复制为 secret.yaml 并填入真实值后应用：
#   kubectl -n isobuilder apply -f secret.yaml
# 不要把填好的 secret.yaml 提交到 git。
apiVersion: v1
kind: Secret
metadata:
  name: isobuilder-db
  namespace: isobuilder
type: Opaque
stringData:
  # PostgreSQL 连接串（支持 URL 或 key=value 两种写法）。
  # URL 形式:
  #   postgres://user:pass@host:5432/isobuilder?sslmode=prefer
  # key=value 形式（密码含 @ 等特殊字符时更省事）:
  #   host=<host> port=5432 user=<user> password=<pass> dbname=isobuilder sslmode=prefer
  url: "host=REPLACE_ME port=5432 user=REPLACE_ME password=REPLACE_ME dbname=isobuilder sslmode=prefer"

  # 可选：设置后接口需要 Authorization: Bearer <token>；留空表示不鉴权。
  auth_token: ""
