# 复制为 secret.yaml 并填入真实值后应用：
#   kubectl -n isobuilder apply -f secret.yaml
# 不要把填好的 secret.yaml 提交到 git。
apiVersion: v1
kind: Secret
metadata:
  name: isobuilder-db
  namespace: isobuilder
type: Opaque
stringData:
  # 全部运行时配置都在这一个文件里（Deployment 用 -c 指定，不设任何环境变量）。
  # 挂载位置：/etc/isobuilder/config.yaml
  #
  # 优先级：文件 > 环境变量 > 默认值；这里不依赖环境变量。
  # 注意：值含 # 或以 : 开头时要加引号（YAML 语法）。
  config.yaml: |
    addr: ":8080"
    data_dir: /opt/isobuilder/data

    # 数据库（三选一，留空则用容器内 SQLite）：
    #   PostgreSQL URL:      postgres://user:pass@host:5432/isobuilder?sslmode=prefer
    #   PostgreSQL key=value: host=<host> port=5432 user=<user> password=<pass> dbname=isobuilder sslmode=prefer
    #   MySQL URL:           mysql://user:pass@host:3306/isobuilder
    database_url: host=REPLACE_ME port=5432 user=REPLACE_ME password=REPLACE_ME dbname=isobuilder sslmode=prefer

    # 并发构建数；每个构建峰值约占 2×基础 ISO 的空间与 I/O。
    max_concurrent_builds: 1

    # 可选：设置后接口需要 Authorization: Bearer <token>。
    # auth_token: ""
