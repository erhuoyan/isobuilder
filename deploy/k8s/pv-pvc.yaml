# isobuilder — Kubernetes 部署清单
#
# 一次性应用:
#   kubectl create namespace isobuilder
#   kubectl -n isobuilder apply -f deploy/k8s/secret.example.yaml   # 先改好真实值
#   kubectl -n isobuilder apply -f deploy/k8s/pv-pvc.yaml
#   kubectl -n isobuilder apply -f deploy/k8s/deployment.yaml
#   kubectl -n isobuilder apply -f deploy/k8s/service.yaml
#
# 设计要点见 deploy/k8s/README.md。
---
# 一个共享的 NFS PV，全集群复用；每个服务用 subPath 落到自己的子目录。
# 这里只声明一次，后续其它服务挂同一个 PVC 用不同 subPath 即可。
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-shared
  labels:
    app.kubernetes.io/name: nfs-shared
spec:
  capacity:
    storage: 1Ti          # NFS 不按此限额，仅作声明；真实容量由 NFS 服务器磁盘决定
  accessModes:
    - ReadWriteMany       # 多服务共享同一 PVC 必须 RWX
  persistentVolumeReclaimPolicy: Retain   # 删 PVC/PV 也不动 NFS 上的数据
  storageClassName: ""    # 静态绑定，禁用动态供给
  nfs:
    server: 192.168.150.1 # ← 改成你的 NFS 服务器 IP
    path: /data/nfs-provisioner
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-shared
  namespace: isobuilder
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Ti
  volumeName: nfs-shared   # 直接钉死这个 PV，不做选择器匹配
