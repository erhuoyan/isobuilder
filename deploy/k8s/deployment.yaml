# isobuilder Deployment
#
# replicas 恒为 1，不是保守而是硬约束：
#   1. 构建是单进程串行队列，启动时会把遗留的 queued/running 构建标记为失败，
#      第二个副本会把第一个副本正在跑的构建判死。
#   2. 所有副本共享同一个 /data 子目录（subPath），并发挂载会互相踩工作目录。
# 需要吞吐时提高 ISOBUILDER_MAX_CONCURRENT_BUILDS（受 /data 容量与 I/O 约束）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: isobuilder
  namespace: isobuilder
  labels:
    app.kubernetes.io/name: isobuilder
spec:
  replicas: 1
  strategy:
    type: Recreate          # 新旧 Pod 不得同时挂载同一 subPath
  selector:
    matchLabels:
      app.kubernetes.io/name: isobuilder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: isobuilder
    spec:
      # 拉取 hub-pub.jdcloud.com 的镜像需要凭据（集群节点未登录该仓库）。
      # 创建：kubectl -n isobuilder create secret docker-registry jd-registry \
      #          --docker-server=hub-pub.jdcloud.com --docker-username=<user> --docker-password=<pass>
      imagePullSecrets:
        - name: jd-registry
      # 收到 SIGTERM 后 CancelAll + 优雅关停；构建本身耗时长，给足退出窗口。
      terminationGracePeriodSeconds: 60
      containers:
        - name: isobuilder
          # 镜像 tag 形如 <版本号>-<commit>-<时间>，由 deploy/build-image.sh 生成。
          # 升级：kubectl -n isobuilder set image deployment/isobuilder isobuilder=<新 tag>
          image: hub-pub.jdcloud.com/iaas-jf/isobuilder:0.1.13-f90d994-20261016-005932
          imagePullPolicy: IfNotPresent
          # 数据库连接串走 -c 指定的配置文件（Secret 挂载），
          # 避免含特殊字符的 DSN 经环境变量转义；文件缺失时进程直接退出、报错可见。
          args:
            - -c
            - /etc/isobuilder/config.yaml
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ISOBUILDER_ADDR
              value: ":8080"
            - name: ISOBUILDER_DATA_DIR
              value: /data
            # 可选：设置后 API 需要 Authorization: Bearer <token>。
            - name: ISOBUILDER_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: isobuilder-db
                  key: auth_token
                  optional: true
            # 并发构建数：每个构建峰值约占 2×基础 ISO 的空间与 I/O。
            - name: ISOBUILDER_MAX_CONCURRENT_BUILDS
              value: "1"
          volumeMounts:
            - name: nfs
              mountPath: /data
            # 数据库配置文件（仅 database_url）来自 Secret，只读挂载。
            - name: db-config
              mountPath: /etc/isobuilder
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # 存活探测给足余量：构建期间 CPU 打满，进程仍应响应 /api/health。
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              # xorriso 解包/重建是 CPU + 顺序 I/O 密集；不设上限会把节点拖满。
              cpu: "4"
              memory: 4Gi
          securityContext:
            # NFS 以 no_root_squash 导出，root 可直接写卷；ISO 流水线也按 root 预期。
            runAsUser: 0
            allowPrivilegeEscalation: false
      volumes:
        # 卷由 StorageClass managed-nfs-storage 动态供给：
        # provisioner 自动在 NFS 的 /data/nfs-provisioner 下建独立子目录，
        # 因此不需要手工 PV、不需要 subPath、也不需要 initContainer 建目录。
        - name: nfs
          persistentVolumeClaim:
            claimName: isobuilder-data
        # 数据库连接串：Secret 的 config.yaml 键挂载成 /etc/isobuilder/config.yaml。
        - name: db-config
          secret:
            secretName: isobuilder-db
            items:
              - key: config.yaml
                path: config.yaml
